name: yarox
services:
  postgres:
    image: postgres:15-alpine
    container_name: yarox-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yarox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yaroxpassword}
      POSTGRES_DB: ${POSTGRES_DB:-yarox}
    # Security: Internal database port is not exposed to the host machine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yarox} -d ${POSTGRES_DB:-yarox}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: yarox-redis
    # Security: Internal broker port is not exposed to the host machine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    container_name: yarox-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    # Security: Internal storage port is not exposed to the host machine
    volumes:
      - minio_data:/data
    healthcheck:
      # The minio image has no curl; `mc ready local` is MinIO's supported readiness check
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  qdrant:
    image: qdrant/qdrant:v1.8.2
    container_name: yarox-qdrant
    # Security: Internal vector database port is not exposed to the host machine
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yarox-backend
    command: sh -c "python -m scripts.migrate && uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
      - ./datasets:/datasets
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://yarox:yaroxpassword@postgres:5432/yarox}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-yarox-dev-insecure-secret-key-change-in-production-2026-phase4a}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3002,http://127.0.0.1:3000,http://127.0.0.1:3002}

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yarox-celery-worker
    command: celery -A workers.celery_app worker --loglevel=info
    volumes:
      - ./backend:/app
      - ./datasets:/datasets
    depends_on:
      - redis
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://yarox:yaroxpassword@postgres:5432/yarox}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1}
      - CELERY_BROKER_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${REDIS_URL:-redis://redis:6379/0}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: yarox-frontend
    ports:
      - "3002:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  minio_data:
  qdrant_data:
